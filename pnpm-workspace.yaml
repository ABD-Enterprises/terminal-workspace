packages:
  - "apps/*"

# #386: supply-chain guards flagged by the semgrep package_managers.pnpm rules.
# Nothing in the lockfile is a git/tarball/link dependency, and CI installs with
# a frozen lockfile, so none of these changes what is installed today; they
# constrain what a future resolution may pull in.
trustPolicy: no-downgrade
blockExoticSubdeps: true
minimumReleaseAge: 10080
# Cooldown exception (2026-10-24), recorded deliberately per the exception
# recorded in the #414 PR description: these two exact versions are the
# patched releases named by the open GitHub advisories, and both were
# published inside the 7-day window above (vite 8.3.5 on 10-21, six
# advisories affecting 8.2.2 all fixed by 8.3.3; happy-dom 21.0.4 on
# 10-20, GHSA-834v-8h66-3h79 / CVE-2026-115895, the incomplete fix for
# CVE-2026-33943). Dev-scope only; the full validate run exercises each
# bump, and an exact-head independent review verified every other newly
# resolved version was outside the window (vitest 5.0.5, published 10-15,
# resolved under the guard and needs no exemption). Version-scoped rather
# than name-scoped so future releases of vite and happy-dom are still
# subject to the full wait; these two entries can be deleted once the
# versions themselves have aged.
minimumReleaseAgeExclude:
  - vite@8.3.5
  - happy-dom@21.0.4
