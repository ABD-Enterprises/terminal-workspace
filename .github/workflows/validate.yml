name: Validate

on:
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# #227 (CodeQL actions/missing-workflow-permissions, alerts 16 + 19): without an
# explicit block both jobs inherit the repository default token scope, which is
# far wider than either needs. Every step here only reads the repo — checkout,
# pnpm/Node setup, toolchain install, local build/test commands. The Playwright
# and setup-node caches and actions/upload-artifact use the Actions runtime
# services, not GITHUB_TOKEN, so they need no scope here either. Nothing in this
# workflow comments, writes to an issue or PR, publishes, requests OIDC, or
# pushes. Scope any future step that does need more at the job level rather than
# widening this block.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Bootstrap repo
        run: npm run setup

      - name: Install Playwright browser
        run: node ./scripts/pnpmw.mjs exec playwright install --with-deps chromium

      - name: Run validate
        run: npm run validate:ci

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/e2e
            playwright-report
            test-results

  # #128: compile + test the Rust crate so a broken native build can no longer
  # ship "green". Public pull-request code runs on GitHub-hosted macOS.
  rust-validate:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: src-tauri

      - name: Bootstrap repo
        run: npm run setup

      # native:check generates icons + builds the frontend (tauri.conf's
      # frontendDist must exist for generate_context!) + runs cargo check;
      # validate:rust then adds cargo test. The localhost-sshd session fixture
      # stays #[ignore] (needs an unsandboxed sshd — tracked in #101).
      - name: Compile + test the Rust crate
        run: npm run validate:rust

      # #101: the localhost-sshd session fixture is #[ignore] by default (it
      # needs an unsandboxed sshd, which sandboxed local/dev envs lack). This
      # hosted macOS runner is a real machine, so run it explicitly to
      # exercise the SSH session lifecycle (create -> open stream -> I/O ->
      # close) end-to-end on every PR. A failure fails Validate. The
      # localShell / external-protocol session lifecycle already runs in the
      # validate:rust step above (those fixtures are not #[ignore]).
      - name: Native SSH session lifecycle (sshd fixture)
        run: cargo test --manifest-path src-tauri/Cargo.toml localhost_ssh_transport_fixture_flow -- --include-ignored
