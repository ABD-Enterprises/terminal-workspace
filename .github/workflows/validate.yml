name: Validate

on:
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# #227 (CodeQL actions/missing-workflow-permissions, alerts 16 + 19): without an
# explicit block both jobs inherit the repository default token scope, which is
# far wider than either needs. Every step here only reads the repo — checkout,
# pnpm/Node setup, toolchain install, local build/test commands. The Playwright
# and setup-node caches and actions/upload-artifact use the Actions runtime
# services, not GITHUB_TOKEN, so they need no scope here either. Nothing in this
# workflow comments, writes to an issue or PR, publishes, requests OIDC, or
# pushes. Scope any future step that does need more at the job level rather than
# widening this block.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Bootstrap repo
        run: npm run setup

      - name: Install Playwright browser
        run: node ./scripts/pnpmw.mjs exec playwright install --with-deps chromium

      - name: Run validate
        run: npm run validate:ci

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/e2e
            playwright-report
            test-results

  # #128: compile + test the Rust crate so a broken native build can no longer
  # ship "green". Public pull-request code runs on GitHub-hosted macOS.
  rust-validate:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # #157: components must be requested explicitly. This action installs a
      # minimal rustup profile, so clippy and rustfmt are not present by default
      # and the two gates below would fail on a clean runner.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: src-tauri

      - name: Bootstrap repo
        run: npm run setup

      # native:check generates icons + builds the frontend (tauri.conf's
      # frontendDist must exist for generate_context!) + runs cargo check;
      # validate:rust then adds cargo test. The localhost-sshd session fixture
      # stays #[ignore] (needs an unsandboxed sshd — tracked in #101).
      # #157: formatting first — it needs no compile, so a style failure is
      # reported in seconds instead of after the build below.
      # #185: the only CI step that runs the real backend.mjs against a live
      # sshd. It sits before the Rust build because it is fast and because a
      # broken transport should fail early rather than after a full compile.
      # This runner already proves sshd works — the Rust sshd fixture below
      # uses the same facility.
      - name: Real backend transport fixture
        run: npm run backend:fixtures

      - name: Check Rust formatting
        run: npm run native:fmt:check

      - name: Compile + test the Rust crate
        run: npm run validate:rust

      # #157: clippy is deliberately NOT inside validate:rust. The ACL drift
      # gate below runs that script a second time on purpose, so anything folded
      # into it pays twice. It must also run after validate:rust, because
      # native-check.sh builds the frontendDist that generate_context! needs.
      - name: Lint the Rust crate
        run: npm run native:clippy

      # #237: #170 started tracking src-tauri/gen/schemas/capabilities.json and
      # acl-manifests.json so a change to the app's effective permission surface
      # is visible in review. Tracking alone gates nothing: capabilities/default.json
      # grants bundled SETS ("core:default", "sql:default"), and a Tauri or plugin
      # bump can widen what a set expands to — the real permissions change while no
      # hand-written file does. Build validation checks schema conformance, not
      # breadth, so it stays green either way.
      #
      # touch build.rs first, deliberately. tauri_build::build() only re-runs when
      # cargo decides the build script is stale, and Swatinem/rust-cache above
      # restores a warm target dir — so `npm run validate:rust` can complete without
      # regenerating anything, leaving this gate comparing the committed files
      # against themselves and passing vacuously. Verified locally: deleting gen/
      # and re-running native-check did NOT recreate it; touching build.rs did.
      # The regeneration is byte-deterministic (confirmed across repeated runs;
      # no absolute paths, LF endings), so forcing it cannot cause false positives.
      #
      # Deliberately scoped to these two files. desktop-schema.json and
      # macOS-schema.json are gitignored IDE aids — byte-identical, 122K each,
      # regenerated on every bump, no security value.
      - name: ACL drift gate
        shell: bash
        run: |
          touch src-tauri/build.rs
          npm run validate:rust >/dev/null
          if ! git diff --quiet -- src-tauri/gen/schemas/capabilities.json src-tauri/gen/schemas/acl-manifests.json; then
            echo "::error::The app's effective permission surface changed, but the regenerated ACL artifacts are not committed."
            echo "The resolved capability set differs from what is tracked on this branch. This is what the" >&2
            echo "artifacts exist to make visible — a dependency bump can widen a bundled permission set" >&2
            echo "without any hand-written file changing." >&2
            echo "" >&2
            echo "Fix: run 'npm run validate:rust' locally and commit the regenerated files." >&2
            echo "" >&2
            echo "Permission delta:" >&2
            git --no-pager diff -- src-tauri/gen/schemas/capabilities.json src-tauri/gen/schemas/acl-manifests.json >&2
            exit 1
          fi
          echo "ACL artifacts match the resolved permission surface."

      # #101: the localhost-sshd session fixture is #[ignore] by default (it
      # needs an unsandboxed sshd, which sandboxed local/dev envs lack). This
      # hosted macOS runner is a real machine, so run it explicitly to
      # exercise the SSH session lifecycle (create -> open stream -> I/O ->
      # close) end-to-end on every PR. A failure fails Validate. The
      # localShell / external-protocol session lifecycle already runs in the
      # validate:rust step above (those fixtures are not #[ignore]).
      - name: Native SSH session lifecycle (sshd fixture)
        run: cargo test --manifest-path src-tauri/Cargo.toml localhost_ssh_transport_fixture_flow -- --include-ignored
