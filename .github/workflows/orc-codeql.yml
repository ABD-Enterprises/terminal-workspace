# Generated by orc adopt --with-workflows from v8.2.0.
# Differential admission requires exact CodeQL evidence on pull requests and merge groups, so
# adopters get a managed CodeQL workflow rather than GitHub's default setup. The runner routing is
# separate from ORC_RUNNER_LABELS because CodeQL's Linux CLI has no ARM64 build.
name: codeql

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  push: {}
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  security-events: write
  actions: read

jobs:
  detect-languages:
    # Exact PR/merge-group evidence matters, and default-branch pushes refresh the baseline alerts.
    # Fork PRs are NOT excluded here. A skipped job reports success, so excluding them let a
    # fork PR satisfy a required CodeQL check with no analysis at all. They run instead on an
    # isolated hosted runner, so untrusted code never reaches a self-hosted pool.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON(vars.ORC_RUNNER_LABELS || '["ubuntu-latest"]') }}
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_languages: ${{ steps.detect.outputs.has_languages }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Resolve CodeQL languages
        id: detect
        shell: bash
        env:
          # Optional override for repos whose generated sources need an explicit list, for example:
          # python,actions
          ORC_CODEQL_LANGUAGES: ${{ vars.ORC_CODEQL_LANGUAGES || '' }}
        run: |
          set -euo pipefail
          files="$(git ls-files)"
          languages=()

          add_language() {
            local candidate="$1"
            local existing
            for existing in "${languages[@]}"; do
              [ "$existing" = "$candidate" ] && return
            done
            languages+=("$candidate")
          }

          has_match() {
            # No pipe: `grep -Eq` exits on its first match, which sends SIGPIPE to `printf`. Under
            # `set -o pipefail` the pipeline then reports 141 and the match reads as FALSE, so in a
            # repository large enough to fill the pipe buffer every detected language disappears and
            # `analyze` is skipped while the workflow still reports green. Reproduced with 200k paths.
            grep -Eq "$1" <<<"$files"
          }

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          if [ -n "${ORC_CODEQL_LANGUAGES}" ]; then
            IFS=',' read -r -a configured <<< "${ORC_CODEQL_LANGUAGES}"
            for candidate in "${configured[@]}"; do
              candidate="$(trim "$candidate")"
              [ -n "$candidate" ] && add_language "$candidate"
            done
          else
            if has_match '(^|/)[^/]+\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$'; then add_language "javascript-typescript"; fi
            if has_match '(^|/)[^/]+\.py$'; then add_language "python"; fi
            if has_match '(^|/)[^/]+\.rb$'; then add_language "ruby"; fi
            if has_match '(^|/)[^/]+\.(java|kt|kts)$'; then add_language "java-kotlin"; fi
            if has_match '(^|/)[^/]+\.go$'; then add_language "go"; fi
            if has_match '(^|/)[^/]+\.cs$'; then add_language "csharp"; fi
            # CodeQL analyses Objective-C/Objective-C++ (.m/.mm) under c-cpp. Without them an
            # Objective-C-only repository detects nothing but `actions` and still reports a
            # successful analysis. `.m` is ambiguous (MATLAB); such repos should pin
            # ORC_CODEQL_LANGUAGES explicitly.
            if has_match '(^|/)[^/]+\.(c|cc|cpp|cxx|h|hh|hpp|hxx|m|mm)$'; then add_language "c-cpp"; fi
            if has_match '(^|/)[^/]+\.swift$'; then add_language "swift"; fi
            if has_match '(^|/)[^/]+\.rs$'; then add_language "rust"; fi
          fi

          if has_match '^\.github/workflows/[^[:space:]]+\.ya?ml$'; then add_language "actions"; fi

          if [ "${#languages[@]}" -eq 0 ]; then
            echo "::notice::codeql: no supported CodeQL languages detected"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "has_languages=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json="["
          for idx in "${!languages[@]}"; do
            if [ "$idx" -gt 0 ]; then json+=", "; fi
            json+="\"${languages[$idx]}\""
          done
          json+="]"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "has_languages=true" >> "$GITHUB_OUTPUT"

  analyze:
    needs: detect-languages
    if: needs.detect-languages.outputs.has_languages == 'true'
    # GitHub-hosted Ubuntu is the adopter default. To opt into self-hosted,
    # set ORC_CODEQL_RUNNER_LABELS to a JSON array of x86-64 labels, for example:
    # ["self-hosted","Linux","X64"]
    # CodeQL's Swift extractor runs only on macOS. Detection can add `swift` to the matrix, so
    # routing every language to the Ubuntu default made a Swift analysis fail on any adopter with
    # a .swift file. Route per language: swift to macOS, everything else to the configured default.
    # A fork PR is pinned to hosted runners regardless of ORC_CODEQL_RUNNER_LABELS, so an
    # adopter who opted into self-hosted does not thereby run untrusted code on their pool.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && (matrix.language == 'swift' && fromJSON('["macos-latest"]') || fromJSON('["ubuntu-latest"]')) || (matrix.language == 'swift' && fromJSON(vars.ORC_CODEQL_SWIFT_RUNNER_LABELS || '["macos-latest"]') || fromJSON(vars.ORC_CODEQL_RUNNER_LABELS || '["ubuntu-latest"]')) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: matrix.language != 'actions'
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  security-drain:
    needs: analyze
    # Never on a fork PR: this job has issues: write and runs on the adopter's own pool.
    if: needs.analyze.result == 'success' && github.event_name != 'merge_group' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ fromJSON(vars.ORC_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
      - name: Fetch pinned orc engine (v8.2.0)
        shell: bash
        env:
          ORC_ENGINE_TOKEN: ${{ secrets.ORC_GUARDS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/orc-security-drain"
          rm -rf "$bundle"
          if ! { git clone --depth 1 --filter=blob:none --sparse --no-checkout \
                   "https://x-access-token:${ORC_ENGINE_TOKEN}@github.com/ABD-Enterprises/sure-forge.git" "$bundle" \
                 && git -C "$bundle" fetch --depth 1 origin "f5e9937e67aea38ccfb150789d8e715c371eeb1f" \
                 && git -C "$bundle" checkout --quiet FETCH_HEAD \
                 && git -C "$bundle" sparse-checkout set --no-cone /tools/orc /tools/security /tools/validators /install /VERSION /package.json; } \
               2>"${RUNNER_TEMP}/orc-security-drain-clone.err"; then
            sed 's/x-access-token:[^@]*@/x-access-token:***@/g' "${RUNNER_TEMP}/orc-security-drain-clone.err" >&2 || true
            echo "::error::could not fetch the pinned orc engine (ABD-Enterprises/sure-forge @ v8.2.0) for security drain"
            exit 1
          fi
          pinned="f5e9937e67aea38ccfb150789d8e715c371eeb1f"
          if printf '%s' "$pinned" | grep -Eq '^[0-9a-f]{40}$'; then
            got="$(git -C "$bundle" rev-parse HEAD)"
            if [ "$got" != "$pinned" ]; then
              echo "::error::orc security drain bundle resolved to $got, expected $pinned"
              exit 1
            fi
          fi
          echo "ORC_ENGINE_DIR=$bundle" >> "$GITHUB_ENV"
      - name: Drain CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
          ORC_PROJECT: ${{ github.repository }}
        run: node "$ORC_ENGINE_DIR/tools/orc/cli.mjs" security drain --repo "${GITHUB_REPOSITORY}"
